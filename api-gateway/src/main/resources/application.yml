spring:
  application:
    name: api-gateway
  zipkin:
    baseUrl: http://localhost:9411/

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
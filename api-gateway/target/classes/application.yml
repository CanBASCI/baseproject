spring:
  application:
    name: api-gateway
  zipkin:
    base-url: http://localhost:9411

  cloud:
    gateway:
      routes:
        - id: user
          uri: lb://user
        - id: iyzico
          uri: lb://iyzico
      discovery:
        locator:
          enabled: true

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
    enabled: true
    instance:
      preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
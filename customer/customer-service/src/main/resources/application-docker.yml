spring:
  application:
    name: customer
  zipkin:
    base-url: http://localhost:9411

  datasource:
    password: 123456
    url: jdbc:postgresql://localhost:5432/cs_customer
    username: postgres

server:
  port: 8381

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
    enabled: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
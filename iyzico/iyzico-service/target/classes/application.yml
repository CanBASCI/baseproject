spring:
  application:
    name: iyzico
  zipkin:
    base-url: http://localhost:9411

server:
  port: 8281

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
    enabled: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"